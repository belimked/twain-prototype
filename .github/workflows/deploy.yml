name: Deploy

on:
  push:
    branches: [main, uat]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # main → Pages project twain-prototype + D1 twain; uat → twain-uat + D1 twain-uat (the uat branch carries its own wrangler.toml)
      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/uat'
        run: npx wrangler d1 migrations apply "${{ github.ref == 'refs/heads/uat' && 'twain-uat' || 'twain' }}" --remote
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name "${{ github.ref == 'refs/heads/uat' && 'twain-uat' || 'twain-prototype' }}" --branch "${{ github.ref == 'refs/heads/uat' && 'main' || (github.head_ref || github.ref_name) }}"
